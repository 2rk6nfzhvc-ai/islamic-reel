name: Daily Islamic reel

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate the reel
        run: python generate_video.py

      - name: Publish as the daily release
        run: |
          gh release view daily >/dev/null 2>&1 || gh release create daily --title "Latest reel" --notes "Auto-updated daily"
          gh release upload daily output/latest.mp4 --clobber
          gh release edit daily --notes "$(cat output/title.txt) ($(date -u +%F))"

      - name: Keep the schedule alive
        run: |
          date -u +%F > last_run.txt
          git config user.name "reel-bot"
          git config user.email "actions@github.com"
          git add last_run.txt
          git commit -m "keepalive" || echo "nothing to commit"
          git push
